# Landing estática — Netlify
# Producción: main
# Branch deploy: dev (activar "Branch deploys" en el panel de Netlify)
# Deploy Preview: cada Pull Request
#
# Variables de entorno requeridas para Supabase:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY

[build]
  publish = "."
  command = "node scripts/write-config.js"

[build.environment]
  NODE_VERSION = "20"

[build.processing]
  skip_processing = false
